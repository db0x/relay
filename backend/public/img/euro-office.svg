<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" version="1.1">
 <!-- Neutrales Dokumentsymbol fuer die Anwendungsgruppe "Euro-Office".
      Bewusst KEINE fremde Marke: hier stand vorher das OnlyOffice-Logo (drei
      Rauten in dessen Markenfarben), was nach dem Wechsel auf Euro-Office
      doppelt falsch war. Ein eigenes, schlichtes Zeichen bindet uns an
      keinen Hersteller.
      Machart wie im uebrigen Satz (docx.svg, note.svg): Schattenebene mit
      opacity 0.2 um einen Pixel versetzt, darueber die Flaeche, obenauf eine
      weisse Lichtkante. -->
 <!-- Schatten -->
 <rect style="opacity:0.2" x="6" y="3.5" width="12" height="14" rx="1.6"/>
 <rect style="opacity:0.2" x="2" y="5.5" width="12" height="14" rx="1.6"/>
 <!-- hintere Seite -->
 <rect style="fill:#8aa4c8" x="6" y="2.5" width="12" height="14" rx="1.6"/>
 <!-- vordere Seite (dasselbe Blau wie docx.svg) -->
 <rect style="fill:#528ff5" x="2" y="4.5" width="12" height="14" rx="1.6"/>
 <!-- angedeutete Textzeilen -->
 <g style="fill:#ffffff;opacity:0.9">
  <rect x="4.6" y="7.6" width="6.8" height="1.2" rx="0.6"/>
  <rect x="4.6" y="10.3" width="6.8" height="1.2" rx="0.6"/>
  <rect x="4.6" y="13" width="4.4" height="1.2" rx="0.6"/>
 </g>
 <!-- Lichtkante -->
 <rect style="opacity:0.2;fill:#ffffff" x="2" y="4.5" width="12" height="1" rx="0.5"/>
</svg>
